aid: coplane
name: CoPlane
description: >-
  CoPlane is a San Francisco-based enterprise software company building an
  AI-native intelligent operations layer for the back office of essential
  enterprises. The platform combines AI agents with deterministic business
  rules on a durable workflow engine to automate high-friction, exception-heavy
  processes across finance, procurement, and operations — including invoice
  intake, PO matching, vendor onboarding, cash application, billing,
  collections, bank and account reconciliation, close processes, and variance
  analysis. CoPlane runs inside the customer's own cloud environment and
  interoperates with existing enterprise systems (SAP, Workday, Coupa) across
  Source-to-Pay, Quote-to-Cash, and Record-to-Report workflows without a
  rip-and-replace migration. Founded in 2024, the company raised a $14M seed
  round in November 2025 led by Ribbit Capital with participation from Stripe,
  Optum Ventures, and Terrain. This profile was surfaced as a Ribbit Capital
  portfolio company and added to the API Evangelist network for enrichment;
  CoPlane does not currently publish a public developer API, OpenAPI, or
  developer portal.
